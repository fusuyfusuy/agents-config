[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-error-kb"
version = "0.1.0"
description = "Zero-Service, Zero-Daemon, Lightweight Agent Knowledge Sharing Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-kb = "backend.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]


